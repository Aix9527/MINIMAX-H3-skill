name: Sync Releases / 同步版本发布

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  public-naming-policy:
    name: Public Naming Policy / 公开命名检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository / 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject disallowed public label / 检查禁用公开命名
        shell: bash
        run: |
          needle="$(printf '\124\150\145\144\157\162\145')"
          if git grep -n -i "$needle" -- .; then
            echo "Public naming policy failed: a disallowed external label is present."
            echo "公开命名检查失败：仓库中存在不允许的外部命名。"
            exit 1
          fi
          echo "Public naming policy passed / 公开命名检查通过"

  skill-contract-check:
    name: Skill Contract Check / Skill 契约检查
    needs: public-naming-policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository / 检出仓库
        uses: actions/checkout@v4

      - name: Validate required contracts / 校验必要契约
        shell: bash
        run: |
          VERSION="$(awk '/^version:/ {gsub(/"/, "", $2); print $2; exit}' SKILL.md)"
          if [ -z "$VERSION" ]; then
            echo "Missing SKILL.md version / SKILL.md 缺少版本号"
            exit 1
          fi

          grep -q 'SUBTLE_LIPSYNC' SKILL.md
          grep -q 'SUBTLE_LIPSYNC' references/audio-identity.md
          grep -q 'SUBTLE_LIPSYNC' references/dialogue-motion.md
          grep -q 'CLOSED_LIPS' references/audio-identity.md
          grep -q 'CLOSED_LIPS' references/dialogue-motion.md
          grep -q 'ACTIVE_SPEAKER' SKILL.md
          grep -q 'ACTIVE_SPEAKER' references/audio-identity.md
          grep -q 'ACTIVE_SPEAKER' references/speaker-scene-lock.md
          grep -q 'MUTE_LISTENER' SKILL.md
          grep -q 'MUTE_LISTENER' references/speaker-scene-lock.md
          grep -q 'SCENE_ID' SKILL.md
          grep -q 'SCENE_LOCK' SKILL.md
          grep -q 'SCENE_LOCK' references/speaker-scene-lock.md
          grep -q 'CANONICAL_SCENE_ANCHOR' references/speaker-scene-lock.md
          grep -q 'Speaker ID belongs \*\*outside\*\* `<d>`' references/audio-identity.md
          grep -q "v${VERSION}" README.md

          if grep -Eq '<d>\[[^]]+\]\[S[0-9]' SKILL.md references/*.md; then
            echo "Invalid speaker ID found inside <d> / 检测到 Speaker ID 被写入 <d>"
            exit 1
          fi

          echo "Skill contract passed for v${VERSION} / v${VERSION} Skill 契约检查通过"

  sync-current-version:
    name: Sync Current Version / 同步当前版本
    needs:
      - public-naming-policy
      - skill-contract-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository / 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create version tag and release if missing / 缺失时创建版本标签与发布
        shell: bash
        run: |
          VERSION="$(awk '/^version:/ {gsub(/"/, "", $2); print $2; exit}' SKILL.md)"
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists / ${TAG} 已存在"
          else
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
            echo "Created ${TAG} / 已创建 ${TAG}"
          fi

          if gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "${TAG} Release already exists / ${TAG} Release 已存在"
            exit 0
          fi

          python3 - "$VERSION" <<'PY' > /tmp/release-notes.md
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          text = Path('CHANGELOG.md').read_text(encoding='utf-8')
          pattern = rf'^## {re.escape(version)}[^\n]*\n(.*?)(?=^## |\Z)'
          match = re.search(pattern, text, flags=re.M | re.S)
          if match:
              print(f'## 版本 {version} / Version {version}\n')
              print(match.group(1).strip())
          else:
              print(f'## 中文\n此 Release 对应版本 {version}。详细变化请查看 CHANGELOG.md。\n')
              print(f'## English\nThis Release corresponds to version {version}. See CHANGELOG.md for details.')
          PY

          gh release create "${TAG}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "MiniMax H3 Director OS V${VERSION} / 导演系统 V${VERSION}" \
            --notes-file /tmp/release-notes.md

  verify-tag-release:
    name: Verify Tagged Release / 校验标签版本发布
    needs:
      - public-naming-policy
      - skill-contract-check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Ensure release exists / 确保 Release 存在
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG Release exists / $TAG Release 已存在"
          else
            echo "$TAG Release has not been created yet; main-branch sync will create it."
            echo "$TAG Release 尚未创建；main 分支同步任务将负责创建。"
          fi
